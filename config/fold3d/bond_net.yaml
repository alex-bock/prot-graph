output_dir: ~/scratch/protein_output

dataset:
  class: Fold3D
  path: ~/scratch/protein-datasets/
  test_split: test_fold
  transform:
    class: ProteinView
    view: residue

task:
  class: PropertyPrediction
  num_mlp_layer: 3
  mlp_batch_norm: True
  mlp_dropout: 0.5
  model:
    class: RGCN
    input_dim: 21
    hidden_dims: [512, 512, 512, 512, 512, 512]
    batch_norm: True
    concat_hidden: True
    short_cut: True
    readout: 'sum'
    num_relation: 8
  graph_construction_model:
    class: BondNetworkConstruction
    node_layers:
      - class: AlphaCarbonNode
    edge_layers:
      - class: PeptideBondEdge
      - class: GetContactsEdge
        contact_type: 'hb'
      - class: GetContactsEdge
        contact_type: 'sb'
      - class: GetContactsEdge
        contact_type: 'pc'
      - class: GetContactsEdge
        contact_type: 'ps'
      - class: GetContactsEdge
        contact_type: 'ts'
      - class: GetContactsEdge
        contact_type: 'vdw'
      - class: GetContactsEdge
        contact_type: 'hp'
    edge_feature: gearnet
  criterion: bce
  num_mlp_layer: 3
  metric: ['auprc@micro', 'f1_max']

optimizer:
  class: SGD
  lr: 1.0e-3
  weight_decay: 5.0e-4
  momentum: 0.98

scheduler:
  class: StepLR
  step_size: 50
  gamma: 0.5

engine:
  gpus: {{ gpus }}
  batch_size: 8
  log_interval: 1000

model_checkpoint: {{ ckpt }}

metric: accuracy [fold_label]

train:
  num_epoch: 100

wandb: {{ wandb }}
